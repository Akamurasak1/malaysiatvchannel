name: Fetch Channel Data

on:
  workflow_dispatch: # Allows manual trigger anytime
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC

# Silence Node 20 deprecation notices by opting into Node 24 execution
env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE24: "true"

jobs:
  update-channels:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Transform Astro Data
        run: |
          curl -s "https://contenthub-api.eco.astro.com.my/api/v2/search-linear?channelGuide=true&platform=acm&channelOrderBy=stbNumber,asc" | jq '[
            .response.channels.data[]? | {
              channel_name: .title,
              channel_number: (.stbNumber | tonumber?),
              category: .category,
              genre: (.genreKey // []),
              language: (.languageKey // [])
            } | select(.channel_number != null)
          ]' > astro_channels.json

      - name: Fetch and Transform Unifi Data
        run: |
          curl -s "https://unifi.com.my/tv/jsonapi/node/channels_list_item" | jq '[
            .data[]? | {
              channel_name: .attributes.title,
              channel_number: (
                .attributes.field_channel_number | 
                if type == "array" then .[0] else . end | 
                tonumber?
              )
            } | select(.channel_number != null)
          ] | sort_by(.channel_number)' > unifitv_channels.json

      - name: Commit and Push Updated JSON Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force stage all .json files in the repository
          git add -A *.json
          
          # Check for staged changes before committing
          if git diff --staged --quiet; then
            echo "No changes detected across provider JSON files."
          else
            git commit -m "Automated update: Refreshed channel lists"
            git push
          fi